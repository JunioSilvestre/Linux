name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run Functional Test Helper
        run: |
          chmod +x ./junior/bash/projects/junior-01-fundamentos/hello-bash/tests/test_helper.bash
          ./junior/bash/projects/junior-01-fundamentos/hello-bash/tests/test_helper.bash

      - name: Run BATS Tests
        run: |
          cd ./junior/bash/projects/junior-01-fundamentos/hello-bash
          bats tests/test_hello.bats
